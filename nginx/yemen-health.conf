# ============================================================================
# Yemen Health System - Nginx Configuration
# ============================================================================
# 
# هذا التكوين يخدم الـ Theme Overlay على واجهة Bahmni الأصلية
# This configuration serves the Theme Overlay on original Bahmni UI
#
# ============================================================================

# Upstream servers
upstream openmrs-backend {
    server yemen-openmrs:8080;
}

upstream odoo-backend {
    server yemen-odoo:8069;
}

upstream openelis-backend {
    server yemen-openelis:8080;
}

upstream reports-backend {
    server yemen-bahmni-reports:8080;
}

server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =========================================================================
    # Yemen Theme CSS Overlay - الـ Theme المخصص لليمن
    # =========================================================================
    
    # Serve Yemen theme styles
    location /bahmni/styles/yemen/ {
        alias /var/www/bahmniapps/styles/yemen/;
        expires 1d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }
    
    # Serve Yemen i18n translations
    location /bahmni/i18n/custom/ {
        alias /var/www/bahmniapps/i18n/custom/;
        expires 1h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }
    
    # Serve Yemen branding
    location /bahmni/branding/custom/ {
        alias /var/www/bahmniapps/branding/custom/;
        expires 1d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # =========================================================================
    # Inject Yemen Theme into Bahmni pages
    # =========================================================================
    
    # Add CSS injection for all Bahmni pages
    sub_filter '</head>' '<link rel="stylesheet" href="/bahmni/styles/yemen/yemen-variables.css"><link rel="stylesheet" href="/bahmni/styles/yemen/yemen-theme.css"><link rel="stylesheet" href="/bahmni/styles/yemen/yemen-components.css"><link rel="stylesheet" href="/bahmni/styles/yemen/yemen-responsive.css"></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    # =========================================================================
    # Bahmni Apps - Original Interface with Theme Overlay
    # =========================================================================
    
    # Root - Bahmni Home
    location / {
        root /var/www/bahmniapps;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Bahmni static files
    location /bahmni {
        alias /var/www/bahmniapps;
        expires 1d;
    }

    # =========================================================================
    # OpenMRS REST API
    # =========================================================================
    location /openmrs {
        proxy_pass http://openmrs-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for OpenMRS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Increase timeout for long-running requests
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # =========================================================================
    # OpenELIS Laboratory System
    # =========================================================================
    location /openelis {
        proxy_pass http://openelis-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # Odoo ERP (Billing/Pharmacy)
    # =========================================================================
    location /odoo {
        proxy_pass http://odoo-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # Bahmni Reports
    # =========================================================================
    location /bahmni-reports {
        proxy_pass http://reports-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # Patient Documents
    # =========================================================================
    location /document_images {
        alias /home/bahmni/document_images;
        expires 30d;
    }

    # =========================================================================
    # Health check endpoint
    # =========================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

